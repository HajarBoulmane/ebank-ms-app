server:
  port: 9999
spring:
  application:
    name: gateway-service
  cloud:
    discovery:
      enabled: true
    gateway:
      server:
        webflux:        # sur Spring Cloud 2025.0 ; sur les anciennes versions : spring.cloud.gateway.routes
          routes:
            - id: r1
              uri: http://localhost:8056
              predicates:
                - Path=/customers/**
            - id: r2
              uri: http://localhost:8057
              predicates:
                - Path=/accounts/**